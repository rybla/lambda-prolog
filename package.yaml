name: lambda-prolog
version: 0.1.0.0
github: "rybla/lambda-prolog"
license: BSD-3-Clause
author: "Henry Blanchette"
maintainer: "contact@rybl.net"
copyright: "2026 Henry Blanchette"
synopsis: The lambda-prolog higher-order logic programming language, implemented in Haskell.
category: Logic Programming

extra-source-files:
  - README.md
  - CHANGELOG.md

dependencies:
  - base >= 4.17 && < 5
  - text >= 2.0
  - containers >= 0.6
  - mtl >= 2.3
  - transformers >= 0.6
  - megaparsec >= 9.6
  - parser-combinators >= 1.3
  - prettyprinter >= 1.7
  - prettyprinter-ansi-terminal >= 1.1
  - filepath >= 1.4
  - directory >= 1.3
  - haskeline >= 0.8
  - optparse-applicative >= 0.18
  - ansi-terminal >= 1.1
  - aeson >= 2.2
  - raw-strings-qq

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Woperator-whitespace

default-extensions:
  - DerivingStrategies
  - DeriveGeneric
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - FlexibleContexts
  - FlexibleInstances
  - GeneralizedNewtypeDeriving
  - ImportQualifiedPost
  - LambdaCase
  - NamedFieldPuns
  - OverloadedStrings
  - PatternSynonyms
  - ScopedTypeVariables
  - StrictData
  - TupleSections
  - TypeApplications
  - ViewPatterns
  - ExistentialQuantification
  - RankNTypes

library:
  source-dirs: src

executables:
  lambda-prolog:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - lambda-prolog

  build-website:
    main: Main.hs
    source-dirs: build-website
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - lambda-prolog
      - text
      - containers
      - mtl
      - filepath
      - directory
      - optparse-applicative
      - aeson

tests:
  lambda-prolog-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - lambda-prolog
      - tasty >= 1.5
      - tasty-hunit >= 0.10
      - tasty-quickcheck >= 0.10
      - QuickCheck >= 2.14
